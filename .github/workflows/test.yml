name: Test
on:
  pull_request:
  push:
    branches: [main]

# Opt into Node.js 24 for JavaScript actions (Node 20 forced from 2026-06-02).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build:page
      # Docker-dependent integration tests are skipped in this lightweight CI;
      # full Docker matrix runs in the release workflow.
      - run: bun test
        env:
          CADGATE_SKIP_DOCKER: '1'
          CADGATE_SKIP_CHROMIUM: '1'
